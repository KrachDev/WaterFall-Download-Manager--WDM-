[package]
name = "waterfall"
version = "1.1.0"
description = "Waterfall — Ultra-lightweight IDM & JDownloader modern hybrid download suite"
authors = ["KrachDev"]
license = "ISC"
repository = ""
edition = "2021"

[lib]
name = "waterfall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
